name: concordia_college
description: Concordia College — Management Portal mobile app. 100% identical to the web app's mobile preview.
publish_to: 'none'
version: 3.0.0+8

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── WebView (core — wraps the web app for pixel-perfect match) ──
  webview_flutter: ^4.9.0
  webview_flutter_android: ^3.16.0
  webview_flutter_wkwebview: ^3.13.0

  # ── URL launcher ──
  url_launcher: ^6.2.2

  # ── Icons ──
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
