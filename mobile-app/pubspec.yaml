name: concordia_college
description: Concordia College — Management Portal mobile app. 100% identical to the web app's mobile preview.
publish_to: 'none'
version: 4.7.7+38

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── WebView (core — wraps the web app for pixel-perfect match) ──
  webview_flutter: ^4.9.0
  webview_flutter_android: ^3.16.0
  webview_flutter_wkwebview: ^3.13.0

  # ── URL launcher ──
  url_launcher: ^6.2.2

  # ── Icons ──
  cupertino_icons: ^1.0.6

  # ── Firebase Cloud Messaging (push notifications) ──
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # ── v4.5.0: Shared preferences (for persisting "has prompted" flags so we
  #    don't nag the user about Auto-start / battery optimization every launch) ──
  shared_preferences: ^2.2.2

  # ── v4.6.6: File download/preview support for student documents ──
  #    path_provider gives us a writable temp directory to stage files.
  #    share_plus opens the Android share sheet so the user can save the
  #    file to Downloads, share it via WhatsApp, or open it with any
  #    installed viewer (Photos, PDF reader, Office, etc.).
  path_provider: ^2.1.4
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
