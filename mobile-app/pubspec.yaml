name: concordia_college
description: Concordia College — Management Portal mobile app. Admin, accountant, admissions, academic, teacher, student & parent portals in one app.
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── HTTP & networking ──
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # ── State management ──
  provider: ^6.1.1

  # ── Storage ──
  shared_preferences: ^2.2.2

  # ── Routing ──
  go_router: ^17.3.0

  # ── UI helpers ──
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  fl_chart: ^0.66.0
  intl: ^0.19.0

  # ── Utilities ──
  url_launcher: ^6.2.2
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

