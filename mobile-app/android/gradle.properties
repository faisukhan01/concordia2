org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m
kotlin.daemon.enabled=false
android.useAndroidX=true
# Jetifier OFF — all plugins are already AndroidX. AGP 8.2.1's Jetifier can't
# read Java 21 bytecode (class v65) in bcprov-jdk18on-1.80.jar, which breaks
# the build under JDK 21. Disabling it is safe and recommended for modern apps.
android.enableJetifier=false
