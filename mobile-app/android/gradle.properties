org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier OFF — all plugins are already AndroidX. AGP 8.2.1's Jetifier can't
# read Java 21 bytecode (class v65) in bcprov-jdk18on-1.80.jar, which breaks
# the build under JDK 21. Disabling it is safe and recommended for modern apps.
android.enableJetifier=false
